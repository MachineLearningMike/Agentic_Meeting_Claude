[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-meeting"
version = "0.1.0"
description = "Structured human-AI meetings on Claude, with persistent project memory."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.12.0",
]

[project.optional-dependencies]
ui = ["chainlit>=2.0.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["agentic_meeting*"]
